<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Questions</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    background: #f5f5f5; /* light gray background */
  }

  header {
    background: #ffcc00;
    padding: 20px;
    text-align: center;
    font-size: 2em;
    font-weight: bold;
    color: #333;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }

  .container {
    max-width: 800px;
    margin: 40px auto;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    padding: 30px 40px;
  }

  h2 {
    color: #333;
    margin-bottom: 30px;
    text-align: center;
  }

  #question-container {
    margin-top: 20px;
  }

  .question {
    font-size: 1.3em;
    margin-bottom: 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .options button {
    background: linear-gradient(to right, #ffcc00, #ff9900);
    border: none;
    padding: 12px 20px;
    font-size: 1em;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #fff;
    font-weight: bold;
  }

  .options button:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 10px rgba(0,0,0,0.2);
  }

  #end-btn {
    margin-top: 30px;
    background: #ff3300;
    color: #fff;
    font-weight: bold;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.2s ease;
  }

  #end-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 10px rgba(0,0,0,0.2);
  }

  #info-box {
    color: red;
    font-weight: bold;
    margin-top: 20px;
    text-align: center;
  }

</style>
</head>
<body>

<header>Online Test Portal</header>

<div class="container">
  <h2>Test Questions</h2>
  <div id="question-container">Loading questions...</div>
  <button id="end-btn" onclick="endTest()">End Test</button>
  <div id="info-box"></div>
</div>

<script>
let questionCount = 0;
let questions = [];

// Fetch questions from JSON
fetch("questions.json")
  .then(res => res.json())
  .then(data => {
    questions = data.sort(() => 0.5 - Math.random()); // randomize
    showQuestion();
  })
  .catch(err => {
    document.getElementById("question-container").innerHTML = "Failed to load questions.";
    console.error(err);
  });

// Show current question
function showQuestion() {
  if(questionCount >= questions.length){
    endTest();
    return;
  }

  let q = questions[questionCount];
  let html = `<div class="question">Q${questionCount + 1}: ${q.q}</div>`;
  html += `<div class="options">`;
  q.options.forEach(opt => {
    html += `<button onclick="nextQuestion('${opt}')">${opt}</button>`;
  });
  html += `</div>`;
  document.getElementById("question-container").innerHTML = html;
}

// Next question
function nextQuestion(selectedOption) {
  console.log(`Question ${questionCount+1} answer: ${selectedOption}`); // store answers if needed
  questionCount++;
  showQuestion();
}

// End test manually
function endTest() {
  fetch("http://127.0.0.1:3000/end-test")
    .then(res => res.json())
    .then(d => {
      alert(d.status);
      window.location.href = "end.html"; // redirect to end page
    });
}

// Start ML detection automatically
fetch("http://127.0.0.1:3000/start-test")
  .then(res => res.json())
  .then(d => console.log(d.status))
  .catch(err => console.error("Failed to start ML:", err));

// Poll backend every 2 seconds to detect auto test end
setInterval(async () => {
  const res = await fetch("http://127.0.0.1:3000/test-status");
  const data = await res.json();

  if (data.message) {
    document.getElementById("info-box").innerText = 
      `⚠️ ${data.message} (Count: ${data.count})`;
  }

  if (data.ended) {
    alert("Test ended due to repeated malpractice!");
    window.location.href = "end.html";
  }
}, 2000);

</script>
</body>
</html>
