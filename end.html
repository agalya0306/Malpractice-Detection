<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Ended</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 40px 60px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
    }

    h2 {
      color: #ff3300;
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      color: #333;
      margin-bottom: 30px;
    }

    a {
      text-decoration: none;
      background: linear-gradient(to right, #ffcc00, #ff6600);
      color: #fff;
      padding: 12px 25px;
      border-radius: 10px;
      font-weight: bold;
      transition: all 0.2s ease;
      display: inline-block;
    }

    a:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Test Ended</h2>
    <p>The test was ended due to repeated malpractice or student submission.</p>
    <a href="index.html">Go to Home</a>
  </div>

</body>
</html>
